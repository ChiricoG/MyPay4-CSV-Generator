description:
  it:
    localisedName: Generatore CSV MyPay4 - Tracciato 1_4
    genericName: Generatore CSV Dovuti
    shortDescription: >
      Applicazione desktop per la creazione, modifica e validazione di file CSV
      nel formato MyPay4 tracciato 1_4, conforme alle specifiche di integrazione
      della Regione Puglia per il portale dei pagamenti PagoPA.
    longDescription: >
      MyPay4 CSV Generator è un'applicazione desktop (Python/Tkinter) che
      consente agli operatori degli Enti Locali di creare e gestire i flussi CSV
      di dovuti da importare nel portale dei pagamenti MyPay4 della Regione
      Puglia, intermediario PagoPA.

      Funzionalità principali:

      - Creazione guidata di righe CSV con validazione in tempo reale di tutti i
        campi obbligatori e facoltativi del tracciato 1_4 (incluso supporto
        multibeneficiario e bilancio XML).

      - Importazione di CSV esistenti per modifica o integrazione.

      - Generazione automatica dello IUD (con prefisso configurabile).

      - Editor visuale per la struttura XML del bilancio (capitoli, uffici,
        accertamenti).

      - Funzione di aumento massivo degli importi (percentuale o valore fisso)
        con opzioni avanzate di gestione del bilancio XML.

      - Esportazione in formato ZIP pronto per l'upload via web service
        paaSILAutorizzaImportFlusso.

      - Logging rotante su file per audit e diagnostica.

      Il software implementa integralmente il tracciato di import versione 1_4
      descritto nel "Manuale Integrazione Ente - MyPay4 v2.2" (Regione Puglia,
      febbraio 2025).
    documentation: "https://github.com/PLACEHOLDER_ENTE/mypay4-csv-generator/blob/main/README.md"
    apiDocumentation: "https://pagamenti.regione.puglia.it/MyPay/ws/pa/services/PagamentiTelematiciDovutiPagati.wsdl"
    features:
      - Generazione e validazione CSV tracciato MyPay4 1_4
      - Supporto pagamenti multibeneficiario (flagMultiBeneficiario)
      - Editor bilancio XML (capitoli, uffici, accertamenti)
      - Aumento massivo importi con gestione bilancio XML
      - Importazione e modifica di CSV esistenti
      - Esportazione ZIP compatibile con paaSILAutorizzaImportFlusso
      - Logging rotante su file per audit
      - Interfaccia grafica Tkinter (nessuna dipendenza da browser)
