[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypay4-csv-generator"
version = "2.3.2"
description = "Generatore CSV professionale per tracciato MyPay4 v1.4"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "EUPL-1.2"}
authors = [
    {name = "Gianmarco Chirico", email = "gianmarco.chirico@clebari.com"}
]
dependencies = [
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mypay4-gen = "mypay4_generator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
